<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./image/d.png">
    <meta property="og:image" content="./image/banner.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSK 1-6 · Luyện Từ Vựng</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800;900&display=swap');

        :root {
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --accent: #ff4d6d;
            --accent2: #7b2cbf;
            --accent3: #00d4ff;
            --text: #f0f0f5;
            --muted: #9999aa;
            --success: #00e676;
            --error: #ff5252;
            --glass: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.12);
            --animate-duration: 0.5s;
            --stage-max: 560px;
            --font-tech: 'Orbitron', 'Be Vietnam Pro', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Be Vietnam Pro', 'Noto Sans SC', system-ui, sans-serif;
            background: var(--bg);
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 15% 10%, rgba(123, 44, 191, 0.22), transparent 45%),
                radial-gradient(circle at 85% 0%, rgba(0, 212, 255, 0.16), transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(255, 77, 109, 0.14), transparent 45%);
            background-size: 42px 42px, 42px 42px, auto, auto, auto;
            background-attachment: fixed;
            background-position: center, center, center, center, center;
            animation: grid-drift 30s linear infinite;
            color: var(--text);
            min-height: 100dvh;
            overflow-x: hidden;
        }

        @keyframes grid-drift {
            0% {
                background-position: 0 0, 0 0, center, center, center;
            }

            100% {
                background-position: 42px 42px, 42px 42px, center, center, center;
            }
        }

        @media (min-width: 860px) {
            :root {
                --stage-max: 900px;
            }
        }

        #fw-canvas {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #fw-canvas.active {
            opacity: 1;
        }

        /* ===== Loading overlay ===== */
        #load-overlay {
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: rgba(15, 15, 26, 0.72);
            backdrop-filter: blur(3px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.9rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }

        #load-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        #load-overlay .spinner-border {
            width: 3rem;
            height: 3rem;
            color: var(--accent3);
        }

        #load-overlay span {
            color: var(--muted);
            font-size: 0.9rem;
            letter-spacing: 0.02em;
        }

        header {
            text-align: center;
            padding: 1.5rem 1rem 0.5rem;
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-family: var(--font-tech);
            font-size: clamp(1.5rem, 5.4vw, 2.6rem);
            font-weight: 800;
            letter-spacing: 0.02em;
            background: linear-gradient(135deg, #ff4d6d, #00d4ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        header p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 0.3rem;
            transition: opacity 0.25s;
        }

        .levels {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.6rem 0.8rem 0.4rem;
            flex-wrap: wrap;
            position: relative;
            z-index: 10;
            max-width: var(--stage-max);
            margin: 0 auto;
        }

        .level-btn {
            font-family: var(--font-tech);
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 0.45rem 0.95rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: transform 0.15s, background 0.25s, color 0.25s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
        }

        .level-btn:hover {
            transform: translateY(-2px);
            color: var(--text);
        }

        .level-btn:active {
            transform: translateY(0) scale(0.96);
        }

        .level-btn.active {
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.35);
        }

        .modes {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem 0.8rem 0.8rem;
            flex-wrap: wrap;
            position: relative;
            z-index: 10;
            max-width: var(--stage-max);
            margin: 0 auto;
        }

        .mode-btn {
            font-family: var(--font-tech);
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem 1.2rem;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: transform 0.15s, background 0.25s, box-shadow 0.25s;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
        }

        .mode-btn:active {
            transform: translateY(0) scale(0.96);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #ff4d6d, #7b2cbf);
            border-color: transparent;
            box-shadow: 0 4px 16px rgba(255, 77, 109, 0.35);
        }

        /* ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-anim 0.55s ease-out;
            background: rgba(255, 255, 255, 0.45);
            pointer-events: none;
        }

        @keyframes ripple-anim {
            to {
                transform: scale(3.2);
                opacity: 0;
            }
        }

        .search-wrap {
            max-width: var(--stage-max);
            margin: 0 auto;
            padding: 0.2rem 0.9rem 0.6rem;
            position: relative;
            z-index: 30;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0.6rem 0.8rem;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .search-box:focus-within {
            border-color: var(--accent3);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.14), 0 0 18px rgba(0, 212, 255, 0.15);
        }

        .search-icon {
            font-size: 0.95rem;
            opacity: 0.7;
            flex-shrink: 0;
        }

        #global-search {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 0.92rem;
        }

        #global-search::placeholder {
            color: var(--muted);
        }

        .search-clear {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 8px;
            flex-shrink: 0;
            transition: color 0.2s, background 0.2s;
        }

        .search-clear:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-results {
            position: absolute;
            left: 0.9rem;
            right: 0.9rem;
            top: calc(100% - 0.1rem);
            max-height: 340px;
            overflow-y: auto;
            background: rgba(18, 18, 32, 0.98);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 40;
        }

        .search-results.show {
            display: block;
        }

        .search-result-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.65rem 0.85rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            transition: background 0.15s;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover,
        .search-result-item.active {
            background: rgba(0, 212, 255, 0.09);
        }

        .sr-hanzi {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            flex-shrink: 0;
            min-width: 2.6em;
        }

        .sr-body {
            flex: 1;
            min-width: 0;
        }

        .sr-pinyin {
            font-size: 0.82rem;
            color: var(--accent3);
        }

        .sr-meaning {
            font-size: 0.85rem;
            color: #d8d8e2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sr-level {
            font-family: var(--font-tech);
            font-size: 0.62rem;
            letter-spacing: 0.04em;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.2rem 0.5rem;
            flex-shrink: 0;
        }

        .search-empty,
        .search-loading {
            padding: 1rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .sr-mark {
            color: var(--accent);
            font-weight: 700;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            padding: 0.4rem 1rem 1rem;
            position: relative;
            z-index: 10;
            flex-wrap: wrap;
            max-width: var(--stage-max);
            margin: 0 auto;
        }

        .stat {
            text-align: center;
        }

        .stat-val {
            font-family: var(--font-tech);
            font-size: 1.4rem;
            font-weight: 700;
            color: #00d4ff;
            text-shadow: 0 0 12px rgba(0, 212, 255, 0.45);
            display: inline-block;
            transition: color 0.3s;
        }

        .stat-val.pulse {
            animation: stat-pulse 0.4s ease;
        }

        @keyframes stat-pulse {
            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(1.35);
                color: #00e676;
            }

            100% {
                transform: scale(1);
            }
        }

        .stat-label {
            font-family: var(--font-tech);
            font-size: 0.68rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .stage {
            max-width: var(--stage-max);
            margin: 0 auto;
            padding: 0 0.9rem 3rem;
            position: relative;
            z-index: 10;
            transition: max-width 0.3s;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .card-container {
            perspective: 1200px;
            height: 300px;
            margin-bottom: 1rem;
        }

        @media (min-width: 860px) {
            .card-container {
                height: 380px;
            }
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(.4, .2, .2, 1);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: linear-gradient(160deg, rgba(26, 26, 46, 0.92), rgba(18, 18, 32, 0.96));
            backdrop-filter: blur(6px);
            border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(0, 212, 255, 0.06) inset;
            transition: box-shadow 0.3s, border-color 0.3s;
            overflow: hidden;
        }

        /* Góc HUD kiểu tương lai ở 4 góc thẻ */
        .card-face::before,
        .card-face::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border: 2px solid var(--accent3);
            opacity: 0.55;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .card-face::before {
            top: 10px;
            left: 10px;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 8px;
        }

        .card-face::after {
            bottom: 10px;
            right: 10px;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 8px;
            border-color: var(--accent);
        }

        .card:hover .card-face {
            box-shadow: 0 10px 36px rgba(123, 44, 191, 0.4), 0 0 26px rgba(0, 212, 255, 0.16);
            border-color: rgba(0, 212, 255, 0.35);
        }

        .card:hover .card-face::before,
        .card:hover .card-face::after {
            opacity: 1;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .hanzi {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: clamp(2.6rem, 11vw, 5.2rem);
            font-weight: 700;
            color: var(--text);
            opacity: 1;
        }

        .pinyin {
            font-size: 1.3rem;
            color: #00d4ff;
            text-shadow: 0 0 14px rgba(0, 212, 255, 0.4);
            margin-top: 0.6rem;
        }

        .meaning {
            font-size: 1.05rem;
            margin-top: 0.8rem;
            text-align: center;
            color: #e0e0e8;
            max-width: 95%;
            line-height: 1.4;
        }

        .hint {
            position: absolute;
            bottom: 12px;
            font-family: var(--font-tech);
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            color: var(--muted);
        }

        @media (min-width: 860px) {
            .hanzi {
                font-size: clamp(3.2rem, 7vw, 6rem);
            }
        }

        .btn {
            font-family: var(--font-tech);
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.65rem 1.2rem;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            min-height: 44px;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.25s, border-color 0.25s;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.18);
        }

        .btn:active {
            transform: translateY(0) scale(0.97);
        }

        .btn.primary {
            background: linear-gradient(135deg, #ff4d6d, #7b2cbf);
            border: none;
            box-shadow: 0 4px 18px rgba(255, 77, 109, 0.3);
        }

        .btn.primary:hover {
            box-shadow: 0 4px 22px rgba(255, 77, 109, 0.5);
        }

        .btn.know {
            background: rgba(0, 230, 118, 0.14);
            border-color: rgba(0, 230, 118, 0.4);
            color: #baffdb;
        }

        .btn.know:hover {
            box-shadow: 0 0 16px rgba(0, 230, 118, 0.3);
        }

        .btn.dontknow {
            background: rgba(255, 82, 82, 0.14);
            border-color: rgba(255, 82, 82, 0.4);
            color: #ffc7c7;
        }

        .btn.dontknow:hover {
            box-shadow: 0 0 16px rgba(255, 82, 82, 0.3);
        }

        .card-nav,
        .controls {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
        }

        .rate-row {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-top: 0.6rem;
        }

        .quiz-question,
        .type-question {
            position: relative;
            background: linear-gradient(160deg, rgba(26, 26, 46, 0.92), rgba(18, 18, 32, 0.96));
            backdrop-filter: blur(6px);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 2rem 1.2rem;
            text-align: center;
            margin-bottom: 1rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(0, 212, 255, 0.06) inset;
            overflow: hidden;
        }

        .quiz-question::before,
        .quiz-question::after,
        .type-question::before,
        .type-question::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent3);
            opacity: 0.45;
        }

        .quiz-question::before,
        .type-question::before {
            top: 10px;
            left: 10px;
            border-right: none;
            border-bottom: none;
        }

        .quiz-question::after,
        .type-question::after {
            bottom: 10px;
            right: 10px;
            border-left: none;
            border-top: none;
            border-color: var(--accent);
        }

        .quiz-hanzi {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: clamp(2.3rem, 9vw, 4.4rem);
            font-weight: 700;
        }

        .quiz-pinyin-hint {
            font-size: 1rem;
            color: var(--muted);
            margin-top: 0.4rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .quiz-pinyin-hint.show {
            opacity: 1;
        }

        .options {
            display: grid;
            gap: 0.6rem;
        }

        .option {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0.95rem 1.1rem;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
            color: var(--text);
            min-height: 50px;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(10px);
            animation: opt-in 0.35s ease forwards;
            transition: border-color 0.25s, background 0.25s, transform 0.15s;
        }

        .option:hover:not(.disabled) {
            transform: translateY(-2px);
            border-color: rgba(0, 212, 255, 0.5);
        }

        @keyframes opt-in {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .option.correct {
            border-color: var(--success);
            background: rgba(0, 230, 118, 0.15);
            animation: correct-pop 0.5s ease;
        }

        @keyframes correct-pop {
            0% {
                transform: scale(1);
            }

            35% {
                transform: scale(1.035);
            }

            100% {
                transform: scale(1);
            }
        }

        .option.wrong {
            border-color: var(--error);
            background: rgba(255, 82, 82, 0.15);
            animation: shake-x 0.45s ease;
        }

        @keyframes shake-x {

            10%,
            90% {
                transform: translateX(-2px);
            }

            20%,
            80% {
                transform: translateX(4px);
            }

            30%,
            50%,
            70% {
                transform: translateX(-7px);
            }

            40%,
            60% {
                transform: translateX(7px);
            }
        }

        .option.disabled {
            pointer-events: none;
        }

        .type-hanzi {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: clamp(2.5rem, 10vw, 4.6rem);
            font-weight: 700;
        }

        .type-meaning {
            font-size: 1.05rem;
            color: var(--muted);
            margin-top: 0.6rem;
        }

        .pinyin-input {
            width: 100%;
            background: var(--glass);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 0.95rem;
            font-size: 1.2rem;
            color: var(--text);
            text-align: center;
            outline: none;
            margin-bottom: 0.6rem;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .pinyin-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.15);
        }

        .pinyin-input.correct {
            border-color: var(--success);
            animation: correct-pop 0.5s ease;
        }

        .pinyin-input.wrong {
            border-color: var(--error);
            animation: shake-x 0.45s ease;
        }

        .feedback {
            text-align: center;
            min-height: 1.4rem;
            font-size: 0.95rem;
            margin-bottom: 0.6rem;
            transition: opacity 0.2s;
        }

        .feedback.ok {
            color: var(--success);
        }

        .feedback.err {
            color: var(--error);
        }

        .tone-help {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            margin-bottom: 0.8rem;
        }

        .tone-btn {
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--muted);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.15s, color 0.2s, border-color 0.2s;
        }

        .tone-btn:hover {
            transform: translateY(-2px);
            color: var(--accent3);
            border-color: var(--accent3);
        }

        .tone-btn:active {
            transform: scale(0.9);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 0.8rem 0 0.3rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4d6d, #00d4ff, #7b2cbf);
            background-size: 200% 100%;
            animation: progress-flow 2.4s linear infinite;
            border-radius: 2px;
            transition: width 0.35s ease;
        }

        @keyframes progress-flow {
            to {
                background-position: -200% 0;
            }
        }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e1e2e;
            border: 1px solid var(--border);
            padding: 0.7rem 1.3rem;
            border-radius: 12px;
            font-size: 0.9rem;
            z-index: 10000;
            transition: transform 0.35s cubic-bezier(.34, 1.56, .64, 1), opacity 0.35s;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            opacity: 0;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .fade-swap {
            animation: fade-swap-in 0.35s ease;
        }

        @keyframes fade-swap-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Modal tổng kết vòng học ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(8, 8, 16, 0.72);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .modal-box {
            width: 100%;
            max-width: 460px;
            max-height: 88vh;
            overflow-y: auto;
            background: linear-gradient(160deg, rgba(26, 26, 46, 0.98), rgba(15, 15, 26, 0.99));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.6rem 1.3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 212, 255, 0.08) inset;
            transform: translateY(16px) scale(0.97);
            transition: transform 0.3s cubic-bezier(.34, 1.56, .64, 1);
        }

        .modal-overlay.show .modal-box {
            transform: translateY(0) scale(1);
        }

        .modal-title {
            font-family: var(--font-tech);
            text-align: center;
            font-size: 1.05rem;
            letter-spacing: 0.04em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .modal-score {
            font-family: var(--font-tech);
            text-align: center;
            font-size: 3rem;
            font-weight: 800;
            margin: 0.4rem 0 0.1rem;
            background: linear-gradient(135deg, #ff4d6d, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-detail {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
        }

        .modal-eval {
            text-align: center;
            color: var(--accent3);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .summary-section-title {
            font-family: var(--font-tech);
            font-size: 0.72rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin: 0.9rem 0 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .summary-section-title.ok { color: var(--success); }
        .summary-section-title.bad { color: var(--error); }

        .summary-list {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 0.2rem;
        }

        .summary-row {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.45rem 0.7rem;
            font-size: 0.85rem;
        }

        .summary-row.ok { border-left: 3px solid var(--success); }
        .summary-row.bad { border-left: 3px solid var(--error); }

        .summary-hanzi {
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            flex-shrink: 0;
        }

        .summary-pinyin {
            color: var(--accent3);
            flex-shrink: 0;
        }

        .summary-meaning {
            color: #d8d8e2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .summary-empty {
            font-size: 0.82rem;
            color: var(--muted);
            padding: 0.4rem 0.2rem;
        }

        /* ===== Chế độ Nghe từ ===== */
        .listen-play-btn {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            color: #fff;
            font-size: 2.3rem;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(0, 212, 255, 0.35);
            transition: transform 0.15s, box-shadow 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.6rem;
        }

        .listen-play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 34px rgba(0, 212, 255, 0.5);
        }

        .listen-play-btn:active {
            transform: scale(0.93);
        }

        .listen-play-btn.speaking {
            animation: listen-pulse 0.9s ease-in-out infinite;
        }

        @keyframes listen-pulse {

            0%,
            100% {
                box-shadow: 0 8px 28px rgba(0, 212, 255, 0.35);
            }

            50% {
                box-shadow: 0 8px 42px rgba(0, 212, 255, 0.75);
            }
        }

        .listen-hint-text {
            font-family: var(--font-tech);
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            color: var(--muted);
        }

        .listen-hanzi-reveal {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: clamp(2.2rem, 9vw, 4rem);
            font-weight: 700;
            margin-top: 0.7rem;
        }

        .listen-pinyin-reveal {
            font-size: 1.05rem;
            color: var(--accent3);
            margin-top: 0.3rem;
        }

        .modal-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 1.2rem;
        }

        .modal-actions .btn {
            flex: 1;
        }

        @media (max-width:480px) {
            .card-container {
                height: 260px;
            }

            .mode-btn {
                padding: 0.5rem 0.9rem;
                font-size: 0.82rem;
            }

            .level-btn {
                padding: 0.4rem 0.7rem;
                font-size: 0.78rem;
            }
        }
    </style>
</head>

<body>
    <canvas id="fw-canvas"></canvas>

    <div id="load-overlay">
        <div class="spinner-border" role="status"></div>
        <span id="load-text">Đang tải từ vựng...</span>
    </div>

    <header class="animate__animated animate__fadeInDown">
        <h1>HSK 1-6 · 词汇练习</h1>
        <p id="header-desc">Chọn cấp độ · Nghĩa tiếng Việt · Thẻ ghi nhớ · Trắc nghiệm · Gõ Pinyin · Nghe từ</p>
    </header>

    <!-- Các nút bên dưới được JS sinh tự động từ config LEVELS / MODES -->
    <div class="levels animate__animated animate__fadeInUp" id="level-tabs"></div>

    <div class="modes animate__animated animate__fadeInUp" id="modes-bar"></div>

    <div class="search-wrap animate__animated animate__fadeInUp" id="search-wrap">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="global-search" placeholder="Tìm từ ở mọi cấp độ HSK... (vd: hôm qua)" autocomplete="off">
            <button class="search-clear" id="search-clear" title="Xóa tìm kiếm" style="display:none">✕</button>
        </div>
        <div class="search-results" id="search-results"></div>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-val" id="stat-total">0</div>
            <div class="stat-label">Tổng từ</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="stat-done">0</div>
            <div class="stat-label">Đã làm</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="stat-correct">0</div>
            <div class="stat-label">Đúng</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="stat-acc">—</div>
            <div class="stat-label">Chính xác</div>
        </div>
    </div>

    <div class="stage">
        <div class="panel active" id="panel-flash">
            <div class="card-container">
                <div class="card" id="flash-card">
                    <div class="card-face card-front">
                        <div class="hanzi" id="flash-hanzi">—</div>
                        <div class="hint">Nhấn để lật thẻ</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="pinyin" id="flash-pinyin"></div>
                        <div class="meaning" id="flash-meaning"></div>
                        <div class="hint">Nhấn để lật lại</div>
                    </div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="flash-progress" style="width:0%"></div>
            </div>
            <div class="rate-row">
                <button class="btn dontknow" id="flash-dontknow">😥 Chưa thuộc</button>
                <button class="btn know" id="flash-know">😊 Đã thuộc</button>
            </div>
            <div class="card-nav">
                <button class="btn" id="flash-prev">← Trước</button>
                <button class="btn primary" id="flash-next">Tiếp →</button>
                <button class="btn" id="flash-shuffle">🔀 Xáo</button>
            </div>
        </div>

        <div class="panel" id="panel-quiz">
            <div class="quiz-question">
                <div class="quiz-hanzi" id="quiz-hanzi">—</div>
                <div class="quiz-pinyin-hint" id="quiz-hint"></div>
            </div>
            <div class="options" id="quiz-options"></div>
            <div class="progress-bar">
                <div class="progress-fill" id="quiz-progress" style="width:0%"></div>
            </div>
            <div class="controls">
                <button class="btn primary" id="quiz-next" style="display:none">Câu tiếp →</button>
                <button class="btn" id="quiz-shuffle">🔀 Xáo</button>
            </div>
        </div>

        <div class="panel" id="panel-type">
            <div class="type-question">
                <div class="type-hanzi" id="type-hanzi">—</div>
                <div class="type-meaning" id="type-meaning"></div>
            </div>
            <div class="tone-help">
                <button class="tone-btn" data-tone="1">ā</button>
                <button class="tone-btn" data-tone="2">á</button>
                <button class="tone-btn" data-tone="3">ǎ</button>
                <button class="tone-btn" data-tone="4">à</button>
                <button class="tone-btn" data-tone="0">a</button>
            </div>
            <input type="text" class="pinyin-input" id="pinyin-input" placeholder="Nhập pinyin (vd: ai4)" autocomplete="off">
            <div class="feedback" id="type-feedback"></div>
            <div class="progress-bar">
                <div class="progress-fill" id="type-progress" style="width:0%"></div>
            </div>
            <div class="controls">
                <button class="btn primary" id="type-check">Kiểm tra</button>
                <button class="btn" id="type-skip">Bỏ qua</button>
                <button class="btn" id="type-shuffle">🔀 Xáo</button>
            </div>
        </div>
        <div class="panel" id="panel-listen">
            <div class="quiz-question" id="listen-question">
                <button class="listen-play-btn" id="listen-play" title="Nghe lại">🔊</button>
                <div class="listen-hint-text">Nhấn để nghe · Chọn đúng nghĩa</div>
                <div class="listen-hanzi-reveal" id="listen-hanzi-reveal" style="display:none"></div>
                <div class="listen-pinyin-reveal" id="listen-pinyin-reveal" style="display:none"></div>
            </div>
            <div class="options" id="listen-options"></div>
            <div class="progress-bar">
                <div class="progress-fill" id="listen-progress" style="width:0%"></div>
            </div>
            <div class="controls">
                <button class="btn primary" id="listen-next" style="display:none">Câu tiếp →</button>
                <button class="btn" id="listen-shuffle">🔀 Xáo</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Modal tổng kết vòng học: hiện khi số câu đã làm == tổng số từ -->
    <div class="modal-overlay" id="summary-modal">
        <div class="modal-box">
            <div class="modal-title">Tổng kết vòng học</div>
            <div class="modal-score" id="summary-score">0%</div>
            <div class="modal-detail" id="summary-detail">0/0 câu đúng</div>
            <div class="modal-eval" id="summary-eval"></div>

            <div class="summary-section-title bad">❌ Các từ đã làm sai</div>
            <div class="summary-list" id="summary-wrong-list"></div>

            <div class="modal-actions">
                <button class="btn" id="summary-close">Đóng</button>
                <button class="btn primary" id="summary-restart">🔁 Học lại vòng mới</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap bundle (Popper + JS) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

   <script src="./js/script.js"></script>
</body>

</html>
